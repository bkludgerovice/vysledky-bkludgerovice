# Nahraje web na WEDOS (vysledky.bkludgerovice.cz) po každé změně v repozitáři.
name: Nahrát web na WEDOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  nasazeni:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout soubory z repozitáře
        uses: actions/checkout@v4

      - name: Nahrát přes FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_SLOZKA }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
