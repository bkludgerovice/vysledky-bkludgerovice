<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --red:#d7192a; --red-deep:#9e0f1c; --on-red:#ffffff;
  --paper:#ffffff; --page:#f3f1f0; --ink:#1b1918; --muted:#655d5b; --line:#ddd6d4;
  --soft:#faf3f2; --bar:#1b1918; --bar-ink:#ffffff; --bar-muted:#b9b1af;
  --gold:#c9a227; --silver:#9aa0a6; --bronze:#b0703c;
  --s1:#d7192a; --s2:#1b1918; --s3:#8a817f; --s4:#7a0e18; --s5:#ef8c95; --s6:#cdbfbc; --s7:#4d4644;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#e0293a; --red-deep:#ff6b78; --paper:#1d1b1b; --page:#141313; --ink:#f2efee; --muted:#b0a7a5; --line:#363231;
  --soft:#2a1e1f; --bar:#000000; --s2:#e9e4e2; --s3:#9b9290; --s4:#ff7d89; --s6:#6b6260; --s7:#c2b9b7; color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#e0293a; --red-deep:#ff6b78; --paper:#1d1b1b; --page:#141313; --ink:#f2efee; --muted:#b0a7a5; --line:#363231;
  --soft:#2a1e1f; --bar:#000000; --s2:#e9e4e2; --s3:#9b9290; --s4:#ff7d89; --s6:#6b6260; --s7:#c2b9b7; color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
img{max-width:100%}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* ŠTÍT: záhlaví rozdělené jako klubové logo – vlevo bílé pole, vpravo červené */
.shield{background:linear-gradient(90deg,var(--paper) 0 50%,var(--red) 50% 100%)}
.shield .wrap{display:grid;grid-template-columns:1fr 1fr;min-height:200px}
.sh-left{display:flex;align-items:center;gap:20px;padding:28px 28px 28px 0;background:var(--paper)}
.sh-left img{width:96px;height:auto;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
.sh-left .club{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.4vw,26px);line-height:1;letter-spacing:.02em;color:var(--red);margin:0}
.sh-left h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,5.6vw,68px);line-height:.9;margin:4px 0 0;text-wrap:balance}
.sh-right{background:var(--red);color:var(--on-red);padding:28px 0 28px 32px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.motto{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(30px,4.2vw,52px);line-height:.95;margin:0;max-width:12ch}
.social{display:flex;gap:10px;flex-wrap:wrap}
.social a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:15px;padding:7px 14px 7px 10px;border:2px solid rgba(255,255,255,.85);border-radius:999px;color:#fff;min-height:40px}
.social a:hover{background:#fff;color:#d7192a}
.social svg{width:20px;height:20px;flex:none}
@media (max-width:760px){
  .shield{background:var(--paper)}
  .shield .wrap{grid-template-columns:1fr;padding-inline:0}
  .sh-left{padding:20px 16px}
  .sh-left img{width:72px}
  .sh-right{padding:18px 16px 20px}
}

/* navigace */
nav.tabs{background:var(--bar);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em;background:none;border:0;color:var(--bar-muted);padding:12px 14px 10px;border-bottom:4px solid transparent;cursor:pointer;white-space:nowrap;min-height:48px}
nav.tabs button:hover{color:#fff}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--red)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
nav.tabs button:focus-visible{outline-color:#fff;outline-offset:-3px}

main{padding-block:28px 56px}
[hidden]{display:none!important}
h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.4vw,38px);line-height:1;margin:0 0 6px}
h3{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 20px;max-width:70ch}
.block{margin-top:40px}
.block:first-child{margin-top:0}
.panel{background:var(--paper);border:1px solid var(--line);padding:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* čísla v přehledu – psaná jako věta, ne jako dlaždice */
.facts{display:flex;flex-wrap:wrap;gap:6px 28px;margin:0;padding:0;list-style:none}
.facts li{font-size:15px;color:var(--muted)}
.facts b{display:block;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--ink)}

/* příští závod */
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--soft);border-left:6px solid var(--red);padding:14px 18px;margin-bottom:28px}
.next b{font-family:var(--display);font-size:24px;font-weight:800}

/* poslední závod */
.latest{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.latest{grid-template-columns:1fr}}
.podium{list-style:none;margin:0;padding:0}
.podium li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.podium li:last-child{border-bottom:0}
.medal{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-family:var(--display);font-weight:800;color:#fff;font-size:17px;line-height:1}
.m1{background:var(--gold)} .m2{background:var(--silver)} .m3{background:var(--bronze)}
.podium .t{font-family:var(--display);font-weight:600;font-size:20px}

/* časová osa závodů */
.matrix-box{overflow-x:auto;background:var(--paper);border:1px solid var(--line)}
table.matrix{border-collapse:collapse;font-size:13px}
table.matrix th,table.matrix td{padding:0;border:0;text-align:center}
table.matrix thead th{font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);padding:10px 2px 6px;writing-mode:vertical-rl;transform:rotate(180deg);height:56px;vertical-align:bottom}
table.matrix tbody th{position:sticky;left:0;background:var(--paper);text-align:left;font-family:var(--display);font-weight:600;font-size:17px;padding:4px 14px 4px 14px;white-space:nowrap;z-index:1}
table.matrix td{width:30px;min-width:30px;height:36px}
table.matrix td.gap{width:14px;min-width:14px;background:repeating-linear-gradient(90deg,transparent 0 5px,var(--line) 5px 6px,transparent 6px 14px)}
.dot{display:inline-grid;place-items:center;border-radius:50%;border:0;padding:0;cursor:pointer;color:#fff;font-size:0;vertical-align:middle}
.dot:hover,.dot:focus-visible{transform:scale(1.18)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* formuláře */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.toolbar label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:9px 11px;min-height:44px;max-width:100%}
input[type=search]{min-width:min(100%,260px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{font-weight:500;opacity:.7;margin-left:4px}
.btn{font:inherit;font-weight:600;border:2px solid var(--red);background:var(--red);color:#fff;padding:8px 16px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.btn.ghost{background:transparent;color:var(--red)}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration-color:var(--red);color:var(--red)}

/* tabulky */
.tbox{overflow-x:auto;background:var(--paper);border:1px solid var(--line)}
table.res{border-collapse:collapse;width:100%;font-size:15px}
table.res th,table.res td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:baseline}
table.res th{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;background:var(--paper)}
table.res td.n,table.res th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.res tr.club td{background:var(--soft)}
table.res tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:3px;background:var(--red);color:#fff;margin-left:6px;vertical-align:1px}
.sexbadge{display:inline-block;min-width:22px;text-align:center;font-weight:700;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.more{margin-top:12px}

/* profil běžce */
.profile-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.profile-head h2{font-size:clamp(34px,5vw,52px)}
.series-runs{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.series-runs li{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);padding:6px 12px 6px 8px;border-radius:999px;font-size:15px}
.series-runs i{width:12px;height:12px;border-radius:50%;display:inline-block}
.series-runs b{font-family:var(--display);font-size:20px}
.namesakes{margin-top:14px;font-size:14px;color:var(--muted)}

/* graf účasti */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);fill:var(--muted);font-size:11px}
.chart .axis{stroke:var(--line)}

footer{background:var(--bar);color:var(--bar-muted);padding:28px 0 36px;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between}
footer .f-club{display:flex;align-items:center;gap:12px;color:#fff}
footer .f-club img{width:40px;height:auto}
footer .f-club b{font-family:var(--display);font-size:20px;display:block;line-height:1}
footer .social a{border-color:rgba(255,255,255,.5)}
.status{padding:40px 0;text-align:center;color:var(--muted)}
.status.err{color:var(--red)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.dot:hover{transform:none}}
</style>
</head>

      for (const sx of ['M', 'Ž']) {
        const timed = tr.rows.filter((r) => r.sex === sx && r.t != null).sort((a, b) => a.t - b.t);
        timed.forEach((r, i) => { r.gPlace = i + 1; });
        best[sx] = timed[0] ? timed[0].t : null;
      }
      const all = tr.rows.filter((r) => r.t != null).map((r) => r.t); tr.bestT = all.length ? Math.min(...all) : null;
      tr.rows.forEach((r) => { r.gap = r.t != null && tr.bestT != null ? r.t - tr.bestT : null; });
    }
  }
  // stejné jméno, různé ID → unikátní kotvy
  const used = {};
  RUNNER_LIST = Object.values(RUNNERS);
  for (const r of RUNNER_LIST) {
    let id = 'b-' + slug(r.name) + (r.yob ? '-' + r.yob : '');
    while (used[id]) id += '-x'; used[id] = 1; r.id = id; r.nkey = norm(r.name);
    r.results.sort((a, b) => b.race.sortKey - a.race.sortKey);
    r.starts = r.results.length;
    r.km = r.results.reduce((s, x) => s + (x.t != null && x.track.km ? x.track.km : 0), 0);
    r.last = r.results[0];
    r.series = new Set(r.results.map((x) => x.race.serie.kod)).size;
    r.club = r.results.some((x) => x.club);
  }
}

const raceName = (race) => race.serie.nazev + ' ' + race.rok;
const raceWhen = (race) => race.datum ? fmtDate(race.datum) : String(race.rok);
const runnerLink = (r) => '<button class="linkbtn" data-go="' + r.id + '">' + esc(r.name) + '</button>';
const raceLink = (race, label) => '<button class="linkbtn" data-go="' + race.id + '">' + esc(label || raceName(race)) + '</button>';
const medal = (n) => n >= 1 && n <= 3 ? '<span class="medal m' + n + '" aria-label="' + n + '. místo">' + n + '</span>' : '<span class="num muted">' + n + '.</span>';
const yobTxt = (row) => row.runner.yob || row.trida || '';

function podiumList(track, sx, n) {
  const list = track.rows.filter((r) => r.sex === sx && r.gPlace && r.gPlace <= (n || 3)).sort((a, b) => a.gPlace - b.gPlace);
  if (!list.length) return '<p class="muted">Bez výsledků.</p>';
  return '<ol class="podium">' + list.map((r) => '<li>' + medal(r.gPlace) + '<span>' + runnerLink(r.runner) + '<br><span class="muted small">' + esc([r.oddil, yobTxt(r)].filter(Boolean).join(', ')) + '</span></span><span class="t num">' + fmtTime(r.t, r.tenths) + '</span></li>').join('') + '</ol>';

function plural(n, a, b, c) { return n === 1 ? a : (n >= 2 && n <= 4 ? b : c); }
function matrixHtml() {
  const years = [...new Set(RACES.map((r) => r.rok))].sort((a, b) => a - b);
  const max = Math.max(...RACES.map((r) => r.rows.length));
  const cols = []; years.forEach((y, i) => { if (i && y - years[i - 1] > 1) cols.push({ gap: true, from: years[i - 1] + 1, to: y - 1 }); cols.push({ y }); });
  const used = SERIES.filter((s) => RACES.some((r) => r.serie === s));
  let h = '<div class="matrix-box"><table class="matrix"><thead><tr><th></th>' + cols.map((c) => c.gap ? '<th title="' + c.from + '–' + c.to + ' bez výsledků">…</th>' : '<th scope="col">' + c.y + '</th>').join('') + '</tr></thead><tbody>';
  for (const s of used) {
    h += '<tr><th scope="row">' + esc(s.nazev) + '</th>';
    for (const c of cols) {
      if (c.gap) { h += '<td class="gap"></td>'; continue; }
      const race = RACES.find((r) => r.serie === s && r.rok === c.y);
      if (!race) { h += '<td></td>'; continue; }
      const d = Math.round(8 + 20 * Math.sqrt(race.rows.length / max));
      h += '<td><button class="dot" data-go="' + race.id + '" style="width:' + d + 'px;height:' + d + 'px;background:' + s.color + '" title="' + esc(raceName(race) + ': ' + race.rows.length + ' v cíli') + '" aria-label="' + esc(raceName(race) + ', ' + race.rows.length + ' v cíli') + '"></button></td>';
    }
    h += '</tr>';
  }
  return h + '</tbody></table></div>';
}

/* ---------- STATISTIKY ---------- */
function topTable(cols, rows) {
  return '<div class="tbox"><table class="res"><thead><tr>' + cols.map((c) => '<th' + (c.n ? ' class="n"' : '') + '>' + c.h + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map((r, i) => '<tr>' + cols.map((c) => '<td' + (c.n ? ' class="n"' : '') + '>' + c.v(r, i) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}
function participationChart(rowsFilter) {
  const years = [...new Set(RACES.map((r) => r.rok))].sort((a, b) => a - b);
  const data = years.map((y) => { const by = {}; let tot = 0; RACES.filter((r) => r.rok === y).forEach((r) => { const n = rowsFilter ? r.rows.filter(rowsFilter).length : r.rows.length; by[r.serie.kod] = n; tot += n; }); return { y, by, tot }; });
  const max = Math.max(1, ...data.map((d) => d.tot));
  const W = Math.max(640, years.length * 26 + 50), H = 260, top = 18, bottom = 34, left = 40, bw = (W - left - 10) / years.length;
  const step = Math.pow(10, Math.floor(Math.log10(max))) * (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 2 : (max / Math.pow(10, Math.floor(Math.log10(max))) > 2 ? 1 : 0.5));
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Počet výsledků podle roku">';
  for (let v = 0; v <= max; v += step) { const yy = H - bottom - (H - top - bottom) * v / max; s += '<line class="axis" x1="' + left + '" x2="' + (W - 6) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (left - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + nf.format(v) + '</text>'; }
  data.forEach((d, i) => {
    let y0 = H - bottom; const x = left + i * bw + 3, w = bw - 6;
    for (const sr of SERIES) { const n = d.by[sr.kod]; if (!n) continue; const hh = (H - top - bottom) * n / max; y0 -= hh; s += '<rect x="' + x + '" y="' + y0 + '" width="' + w + '" height="' + hh + '" style="fill:' + sr.color + '"><title>' + esc(sr.nazev + ' ' + d.y + ': ' + n) + '</title></rect>'; }
    s += '<text x="' + (x + w / 2) + '" y="' + (H - bottom + 14) + '" text-anchor="middle">' + (years.length > 24 ? "'" + String(d.y).slice(2) : d.y) + '</text>';
  });
  s += '</svg>';
  const used = SERIES.filter((sr) => data.some((d) => d.by[sr.kod]));
  return '<div class="panel" style="overflow-x:auto">' + s + '<div class="legend">' + used.map((sr) => '<span><i style="background:' + sr.color + '"></i>' + esc(sr.nazev) + '</span>').join('') + '</div></div>';
}
function recordsHtml(filter) {
  let h = '';
  for (const s of SERIES) {
    const races = RACES.filter((r) => r.serie === s); if (!races.length) continue;
    const tracks = {};
    races.forEach((r) => r.trackList.forEach((t) => { if (t.name === '?') return; (tracks[t.name] = tracks[t.name] || []).push(...t.rows.filter((x) => x.t != null && (!filter || filter(x)))); }));
    const names = Object.keys(tracks).filter((k) => tracks[k].length).sort((a, b) => (trackKm(b) == null ? -1 : trackKm(b)) - (trackKm(a) == null ? -1 : trackKm(a)));
    if (!names.length) continue;
    h += '<div><h3>' + esc(s.nazev) + '</h3>' + topTable([
      { h: 'Trať', v: (k) => esc(k) },
      { h: 'Muži', v: (k) => cell(tracks[k], 'M') },
      { h: 'Ženy', v: (k) => cell(tracks[k], 'Ž') }
    ], names) + '</div>';
  }
  return '<div class="cols">' + h + '</div>';
  function cell(list, sx) { const b = list.filter((x) => x.sex === sx).sort((a, c) => a.t - c.t)[0]; return b ? '<b class="num">' + fmtTime(b.t, b.tenths) + '</b><br>' + runnerLink(b.runner) + ' <span class="muted small">' + b.race.rok + '</span>' : '<span class="muted">–</span>'; }
}
function renderStats() {
  const el = $('#p-statistiky');
  const byStarts = RUNNER_LIST.slice().sort((a, b) => b.starts - a.starts || b.km - a.km).slice(0, 15);
  const byKm = RUNNER_LIST.slice().sort((a, b) => b.km - a.km).slice(0, 15);
  const wins = {}; RACES.forEach((r) => r.main.rows.forEach((x) => { if (x.gPlace === 1) (wins[x.runner.key] = wins[x.runner.key] || { r: x.runner, n: 0, list: [] }).n++; }));
  const byWins = Object.values(wins).sort((a, b) => b.n - a.n).slice(0, 15);
  const finishers = ROWS.filter((x) => x.age != null && x.t != null && x.track.km >= 10 && x.age > 0);
  const oldest = finishers.slice().sort((a, b) => b.age - a.age).slice(0, 10);
  const clubs = {}; ROWS.forEach((x) => { const k = norm(x.oddil); if (!k || k === '-') return; (clubs[k] = clubs[k] || { name: x.oddil, n: 0, people: new Set() }).n++; clubs[k].people.add(x.runner.key); });
  const byClub = Object.values(clubs).sort((a, b) => b.n - a.n).slice(0, 15);
  const yrs = [...new Set(RACES.map((r) => r.rok))].sort((a, b) => b - a).map((y) => { const rs = ROWS.filter((x) => x.race.rok === y); const z = rs.filter((x) => x.sex === 'Ž').length; return { y, races: RACES.filter((r) => r.rok === y), n: rs.length, people: new Set(rs.map((x) => x.runner.key)).size, z: rs.length ? z / rs.length : 0 }; });

  el.innerHTML =
    '<div class="block"><h2>Kolik lidí doběhlo</h2><p class="lead">Výsledky ze všech tratí podle roku a závodu. Najetím na sloupec uvidíte přesné číslo.</p>' + participationChart() + '</div>' +
    '<div class="block"><h2>Nejrychlejší časy</h2><p class="lead">Nejlepší čas na každé trati v našich datech. Trasy se v průběhu let měnily, takže časy z různých let nemusí být úplně srovnatelné.</p>' + recordsHtml() + '</div>' +
    '<div class="block cols">' +
      '<div><h3>Nejvíc startů</h3>' + topTable([{ h: '', n: 1, v: (r, i) => i + 1 + '.' }, { h: 'Jméno', v: (r) => runnerLink(r) + ' <span class="muted small">' + (r.yob || '') + '</span>' }, { h: 'Startů', n: 1, v: (r) => r.starts }], byStarts) + '</div>' +
      '<div><h3>Nejvíc kilometrů</h3>' + topTable([{ h: '', n: 1, v: (r, i) => i + 1 + '.' }, { h: 'Jméno', v: (r) => runnerLink(r) + ' <span class="muted small">' + (r.yob || '') + '</span>' }, { h: 'Km', n: 1, v: (r) => nf1.format(r.km) }], byKm) + '</div>' +
      '<div><h3>Nejvíc vítězství</h3><p class="muted small" style="margin-top:-6px">Hlavní trať, zvlášť muži a ženy.</p>' + topTable([{ h: '', n: 1, v: (r, i) => i + 1 + '.' }, { h: 'Jméno', v: (o) => runnerLink(o.r) + ' <span class="muted small">' + (o.r.yob || '') + '</span>' }, { h: 'Výher', n: 1, v: (o) => o.n }], byWins) + '</div>' +
    '</div>' +
    '<div class="block cols">' +
      '<div><h3>Nejstarší v cíli</h3><p class="muted small" style="margin-top:-6px">Tratě od 10 km, věk v roce závodu.</p>' + topTable([{ h: 'Věk', n: 1, v: (x) => x.age }, { h: 'Jméno', v: (x) => runnerLink(x.runner) }, { h: 'Závod', v: (x) => raceLink(x.race) + ' <span class="muted small">' + esc(x.track.name) + '</span>' }], oldest) + '</div>' +
      '<div><h3>Nejčastější oddíly a města</h3>' + topTable([{ h: '', n: 1, v: (r, i) => i + 1 + '.' }, { h: 'Oddíl / město', v: (c) => esc(c.name) }, { h: 'Výsledků', n: 1, v: (c) => nf.format(c.n) }, { h: 'Lidí', n: 1, v: (c) => nf.format(c.people.size) }], byClub) + '</div>' +
    '</div>' +
    '<div class="block"><h2>Ročníky v číslech</h2>' + topTable([
      { h: 'Rok', v: (d) => '<b>' + d.y + '</b>' },
      { h: 'Závody', v: (d) => d.races.slice().sort((a, b) => a.sortKey - b.sortKey).map((r) => raceLink(r, r.serie.nazev)).join(', ') },
      { h: 'Výsledků', n: 1, v: (d) => nf.format(d.n) }, { h: 'Lidí', n: 1, v: (d) => nf.format(d.people) }, { h: 'Žen', n: 1, v: (d) => Math.round(d.z * 100) + ' %' }
    ], yrs) + '</div>';
}

/* ---------- NÁŠ KLUB ---------- */
function renderClub() {
  const el = $('#p-klub');
  const rows = ROWS.filter((x) => x.club);
  const people = RUNNER_LIST.filter((r) => r.results.some((x) => x.club));
  const top = people.map((r) => ({ r, n: r.results.filter((x) => x.club).length, km: r.results.filter((x) => x.club && x.t != null && x.track.km).reduce((s, x) => s + x.track.km, 0) })).sort((a, b) => b.n - a.n || b.km - a.km).slice(0, 20);
  const pods = rows.filter((x) => x.gPlace && x.gPlace <= 3 && x.track === x.race.main).sort((a, b) => b.race.sortKey - a.race.sortKey || a.gPlace - b.gPlace);
  const kmSum = rows.reduce((s, x) => s + (x.t != null && x.track.km ? x.track.km : 0), 0);
  el.innerHTML = '<div class="block"><h2>BK Ludgeřovice na vlastních závodech</h2><p class="lead">Výsledky, u kterých je uvedený oddíl BK Ludgeřovice. Kdo běžel za město nebo jiný oddíl, se sem nepočítá.</p>' +
    '<ul class="facts"><li><b class="num">' + nf.format(rows.length) + '</b>výsledků</li><li><b class="num">' + nf.format(people.length) + '</b>' + plural(people.length, 'člověk', 'lidé', 'lidí') + '</li><li><b class="num">' + nf.format(Math.round(kmSum)) + '</b>km v cíli</li><li><b class="num">' + pods.length + '</b>' + plural(pods.length, 'stupeň vítězů', 'stupně vítězů', 'stupňů vítězů') + '</li></ul></div>' +
    '<div class="block"><h3>Klubové výsledky podle roku</h3>' + participationChart((x) => x.club) + '</div>' +
    '<div class="block cols"><div><h3>Nejvíc startů za klub</h3>' + topTable([{ h: '', n: 1, v: (o, i) => i + 1 + '.' }, { h: 'Jméno', v: (o) => runnerLink(o.r) }, { h: 'Startů', n: 1, v: (o) => o.n }, { h: 'Km', n: 1, v: (o) => nf.format(Math.round(o.km)) }], top) + '</div>' +
    '<div><h3>Na stupních vítězů</h3><p class="muted small" style="margin-top:-6px">Hlavní trať, pořadí mužů nebo žen.</p>' + (pods.length ? topTable([{ h: '', v: (x) => medal(x.gPlace) }, { h: 'Jméno', v: (x) => runnerLink(x.runner) }, { h: 'Závod', v: (x) => raceLink(x.race) }, { h: 'Čas', n: 1, v: (x) => fmtTime(x.t, x.tenths) }], pods.slice(0, 40)) : '<p class="muted">Zatím žádné.</p>') + '</div></div>' +
    '<div class="block"><h2>Klubové rekordy</h2><p class="lead">Nejlepší časy členů BK Ludgeřovice na každé trati.</p>' + recordsHtml((x) => x.club) + '</div>';
}

/* ---------- navigace ---------- */
const TABS = ['prehled', 'vysledky', 'bezci', 'statistiky', 'klub'];
const rendered = {};
function showTab(t) {
  document.querySelectorAll('nav.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  TABS.forEach((x) => { $('#p-' + x).hidden = x !== t; });
  if (!rendered[t]) { rendered[t] = 1; ({ prehled: renderOverview, vysledky: () => { renderResultsShell(); openRace(RACES[0]); }, bezci: renderRunnersShell, statistiky: renderStats, klub: renderClub })[t](); }
}
function setHash(id) { if (location.hash.slice(1) !== id) { try { history.pushState(null, '', '#' + id); } catch (e) { location.hash = id; } } }
function route(id, push) {
  id = decodeURIComponent(id || '');
  if (id.startsWith('z-')) { const race = RACES.find((r) => r.id === id); if (race) { showTab('vysledky'); openRace(race, null, false); window.scrollTo({ top: 0 }); if (push) setHash(id); return; } }
  if (id.startsWith('b-')) { const r = RUNNER_LIST.find((x) => x.id === id); if (r) { showTab('bezci'); openRunner(r); if (push) setHash(id); return; } }
  const t = TABS.includes(id) ? id : 'prehled';
  showTab(t);
  if (t === 'bezci' && rendered.bezci) { $('#b-profile').hidden = true; $('#b-search').hidden = false; }
  if (push) setHash(t);
}
document.addEventListener('click', (e) => {
  const tab = e.target.closest('nav.tabs button'); if (tab) { route(tab.dataset.tab, true); return; }
  const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); route(go.dataset.go, true); }
});
window.addEventListener('popstate', () => route(location.hash.slice(1), false));
window.addEventListener('hashchange', () => route(location.hash.slice(1), false));

function social(cfg) {
  const k = cfg.klub || {}; let h = '';
  if (k.facebook) h += '<a href="' + esc(k.facebook) + '" target="_blank" rel="noopener">' + ICON_FB + 'Facebook</a>';
  if (k.instagram) h += '<a href="' + esc(k.instagram) + '" target="_blank" rel="noopener">' + ICON_IG + 'Instagram</a>';
  $('#social-top').innerHTML = h; $('#social-foot').innerHTML = h;
  if (k.moto) { $('#motto').textContent = k.moto; $('#f-motto').textContent = k.moto; }
}

async function start() {
  try {
    let csv = $('#embed-csv').textContent.trim(), cfgTxt = $('#embed-config').textContent.trim();
    if (!csv || csv === '__CSV__') { const r = await fetch('data/vysledky.csv', { cache: 'no-cache' }); if (!r.ok) throw new Error('Soubor data/vysledky.csv se nepodařilo načíst (' + r.status + ').'); csv = await r.text(); }
    if (!cfgTxt || cfgTxt === '__CONFIG__') { try { const r = await fetch('data/zavody.json', { cache: 'no-cache' }); cfgTxt = r.ok ? await r.text() : '{}'; } catch (e) { cfgTxt = '{}'; } }
    let fixTxt = $('#embed-opravy').textContent.trim();
    if (!fixTxt || fixTxt === '__OPRAVY__') { try { const r = await fetch('data/opravy.json', { cache: 'no-cache' }); fixTxt = r.ok ? await r.text() : '{}'; } catch (e) { fixTxt = '{}'; } }
    let fix = {}; try { fix = JSON.parse(fixTxt || '{}'); } catch (e) { console.warn('opravy.json nejde přečíst', e); }
    const cfg = JSON.parse(cfgTxt || '{}');
    social(cfg);
    build(csv, cfg, fix);
    if (!RACES.length) throw new Error('Soubor výsledků je prázdný.');
    $('#status').hidden = true;
    $('#f-data').textContent = nf.format(ROWS.length) + ' výsledků z ' + RACES.length + ' ročníků závodů';
    route(location.hash.slice(1), false);
  } catch (e) {
    const st = $('#status'); st.className = 'status err'; st.textContent = 'Výsledky se nenačetly: ' + (e.message || e) + ' Zkontrolujte, že je ve složce data soubor vysledky.csv.';
    console.error(e);
  }
}
start();
})();
</script>
